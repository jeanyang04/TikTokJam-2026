services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: launchpad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: launchpad
    ports:
      # Host 5432 was already taken by an unrelated local Postgres install;
      # 5433 avoids that conflict. Container-internal port stays 5432, so
      # this only affects DATABASE_URL_ADMIN/DATABASE_URL_AGENT's host part.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d launchpad"]
      interval: 2s
      timeout: 3s
      retries: 20

  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: volc-agent-launchpad:local
    restart: unless-stopped
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      CODEX_HOME: /app/codex-home
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-workspace-write}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./codex-home:/app/codex-home
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

volumes:
  pgdata:
